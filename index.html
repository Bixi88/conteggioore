<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3558d6">
<title>Conteggio</title>
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#1b1f2e;--mut:#5b6478;--line:#c9d0e0;--acc:#3558d6;--accd:#2744b0;--tint:#e3e9fc;--field:#eaeefa;
box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem}
.bar{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(20,30,80,.35)}
.bar h1{margin:0;font-size:1.1rem;font-weight:500}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--acc);color:#fff;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 10px);box-shadow:0 -2px 8px rgba(20,30,80,.35)}
.foot div{max-width:480px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between}
.foot small{font-size:.8rem;letter-spacing:.14em;font-weight:500;opacity:.9}
.foot b{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.wrap{max-width:480px;margin:0 auto;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 96px)}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(20,30,80,.14),0 2px 10px rgba(20,30,80,.07)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.hd.m{margin-top:12px}
h2{margin:0;font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--acc)}
.sm{font-size:.8rem;color:var(--mut)}
.sm b{font-size:.95rem;color:var(--accd);font-variant-numeric:tabular-nums}
.g{display:grid;gap:6px;align-items:center}
.g.a{grid-template-columns:4.8rem minmax(0,1fr) 3.4rem}
.g.c{grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr)}
.g.y{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.lb,label{font-weight:600;font-size:.85rem}
input,select,textarea{width:100%;min-height:36px;font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:0;border-bottom:2px solid var(--line);border-radius:8px 8px 0 0;padding:4px 8px}
input{text-align:right}
textarea{display:block;text-align:left;resize:none;overflow:hidden;line-height:1.35;padding:7px 8px}
select{padding:4px 2px;text-align:center;text-align-last:center}
input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:var(--acc);background:var(--tint)}
.r{text-align:right;font-variant-numeric:tabular-nums;font-size:1rem;font-weight:600}
.v{padding-right:8px}
.cell label{display:block;margin-bottom:2px}
.rs{text-align:right;font-size:.72rem;color:var(--mut);padding-right:6px;margin-top:2px}
.rs b{font-size:.85rem;color:var(--accd);font-variant-numeric:tabular-nums}
.sv{display:flex;gap:8px;align-items:center;margin-top:12px}
#fname{text-align:left}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:0;cursor:pointer;border-radius:999px;padding:8px 16px;white-space:nowrap}
.btn.f{background:var(--acc);color:#fff;box-shadow:0 2px 5px rgba(20,30,80,.3)}
.btn.f:active{background:var(--accd)}
.btn.t{background:none;color:#b3261e;padding:4px 6px;font-size:.8rem}
.btn:focus-visible{outline:3px solid #9db4ff;outline-offset:2px}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#msg{flex:1;min-height:1.1em;font-size:.78rem;color:var(--mut)}
.sv.two{margin-top:8px}
.sv.two .btn{flex:1}
.dz{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.btn.d{background:#fdecea;color:#b3261e;border:2px solid #e7b4b0;padding:8px 26px}
.btn.d:active{background:#f6cfcb}
</style>
</head>
<body>
<header class="bar">
  <h1>Conteggio</h1>
</header>
<main class="wrap"><section class="card">
  <div class="hd"><h2>MONTE ORE</h2><div class="sm">ORE <b id="ore">0</b> &nbsp;·&nbsp; ×4 <b id="ore4">0</b></div></div>
  <div class="g a">
    <label for="sett">Settimana</label><input id="sett" inputmode="decimal" aria-label="Giorni settimana"><select id="selS" aria-label="Ore al giorno settimana"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
    <label for="sab">Sabato</label><input id="sab" inputmode="decimal" aria-label="Giorni sabato"><select id="selB" aria-label="Ore al giorno sabato"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
  </div>

  <div class="hd m"><h2>CONTRATTI</h2></div>
  <div class="g c">
    <label for="matt">MATT</label><input id="matt" inputmode="decimal">
    <label for="pom">POM</label><input id="pom" inputmode="decimal">
    <div class="lb">ENERGIA</div><div class="r v" id="en">0</div>
    <label for="ko">KO</label><input id="ko" inputmode="decimal">
  </div>
  <div class="g y">
    <div class="cell"><label for="iban">IBAN</label><input id="iban" inputmode="decimal"><div class="rs">×15 = <b id="iban15">0</b></div></div>
    <div class="cell"><label for="boll">BOLL</label><input id="boll" inputmode="decimal"><div class="rs">×9 = <b id="boll9">0</b></div></div>
    <div class="cell"><label for="prot">PROTETTA</label><input id="prot" inputmode="decimal"><div class="rs">×4 = <b id="prot4">0</b></div></div>
  </div>

  <div class="hd m"><h2>NOTE</h2></div>
  <textarea id="note" rows="1" aria-label="Note" placeholder="Scrivi qui…"></textarea>

  <div class="sv"><input id="fname" aria-label="Nome del file" placeholder="Nome file"></div>
  <div class="sv two"><button class="btn f" id="save">Salva .txt</button><button class="btn f" id="imp">Importa .txt</button></div>
  <div class="sv"><button class="btn f" id="sync" style="flex:1">Sincronizza</button></div>
  <div class="ft"><div id="msg" role="status"></div></div>
  <input type="file" id="impf" accept=".txt,text/plain" hidden>
  <div class="rs" id="ver"></div>
  <div class="dz"><button class="btn d" id="reset">Azzera tutto</button></div>
</section></main>
<footer class="foot"><div><small>TOTALE</small><b id="tot">0</b></div></footer>
<script>
/* ============================================================
   SINCRONIZZAZIONE MANUALE TRA DISPOSITIVI (Firebase Realtime Database)
   Parte solo quando premi il tasto "Sincronizza": mai in automatico.
   1) Incolla qui sotto l'indirizzo del tuo database
   2) Cambia SYNC_PATH con una parola lunga e segreta (solo tua)
   Se DB_URL resta vuoto, l'app salva solo su questo dispositivo.
   ============================================================ */
var DB_URL  = "https://conteggioore-19eab-default-rtdb.europe-west1.firebasedatabase.app";
var SYNC_PATH = "conteggio_h4w9qz7mk2xv8t";

var KEY="conteggio-v3",IDS=["sett","sab","selS","selB","ko","matt","pom","iban","boll","prot","note"],S={},TOT=0;
var SYNC_URL = DB_URL ? DB_URL.replace(/\/+$/,"")+"/"+SYNC_PATH+".json" : "";
try{S=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){S={};}
function n(v){var x=parseFloat(String(v||"").replace(",","."));return isNaN(x)?0:x;}
function f(x){return (Math.round(x*100)/100).toLocaleString("it-IT",{maximumFractionDigits:2});}
function $(i){return document.getElementById(i);}
function st(t){$("msg").textContent=t;}
function grow(){var a=$("note");a.style.height="auto";a.style.height=(a.scrollHeight+a.offsetHeight-a.clientHeight)+"px";}
function calc(){
  var ore=n($("sett").value)*n($("selS").value)+n($("sab").value)*n($("selB").value);
  var o4=ore*4,i15=n($("iban").value)*15,b9=n($("boll").value)*9,p4=n($("prot").value)*4;
  $("ore").textContent=f(ore);$("ore4").textContent=f(o4);
  $("iban15").textContent=f(i15);$("boll9").textContent=f(b9);$("prot4").textContent=f(p4);
  $("en").textContent=f(n($("matt").value)+n($("pom").value));
  TOT=o4+i15+b9+p4;$("tot").textContent=f(TOT);
}

/* ---- Salvataggio locale: localStorage + IndexedDB (copia di sicurezza) ---- */
function idb(cb){try{var r=indexedDB.open("conteggio",1);r.onupgradeneeded=function(){r.result.createObjectStore("k");};r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function storeLocal(js){
  try{localStorage.setItem(KEY,js);}catch(e){}
  idb(function(db){if(!db)return;try{db.transaction("k","readwrite").objectStore("k").put(js,KEY);}catch(e){}});
}

function readFields(){IDS.forEach(function(i){S[i]=$(i).value;});S._t=Date.now();}
function save(){readFields();storeLocal(JSON.stringify(S));}

function apply(D){
  IDS.forEach(function(i){
    var def=(i=="selS"||i=="selB")?"4":"";
    $(i).value=(D[i]!==undefined&&D[i]!==null)?D[i]:def;
  });
  calc();grow();
}

/* ---- Aggiornamento automatico dell'app ----
   APP_VERSION cambia a ogni nuova versione del file. All'apertura e quando torni sull'app,
   la pagina controlla (saltando la cache) se online c'è una versione diversa e, se sì, si ricarica.
   I dati sono già salvati a ogni modifica, quindi il ricaricamento non fa perdere nulla. */
var APP_VERSION="20261010-085744";
function go(u){location.replace(u);}
function checkUpdate(){
  try{
    var a=document.activeElement;
    if(a&&(a.tagName=="INPUT"||a.tagName=="SELECT"||a.tagName=="TEXTAREA"))return; /* non interrompo mentre scrivi */
    var u=location.href.split("#")[0].split("?")[0];
    fetch(u+"?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(h){
      var m=h.match(/APP_VERSION\s*=\s*"([^"]+)"/);
      if(!m||m[1]===APP_VERSION)return;
      var k="upd-"+m[1];
      try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1");}catch(e){} /* una sola volta per versione: niente cicli */
      go(u+"?v="+encodeURIComponent(m[1]));
    }).catch(function(){});
  }catch(e){}
}

/* ---- Sincronizzazione manuale: parte solo dal tasto "Sincronizza" ---- */
function fd(t){return new Date(t).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function sync(){
  if(!SYNC_URL){st("Sincronizzazione non configurata");return;}
  var b=$("sync");b.disabled=true;st("Sincronizzo…");
  fetch(SYNC_URL,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(D){
    var ct=(D&&typeof D==="object"&&D._t)||0,lt=S._t||0;
    if(!ct&&!lt){st("Niente da sincronizzare");return;}
    if(ct===lt){st("Già sincronizzato ✓");return;}
    if(ct>lt){ /* il cloud è più recente: scarico */
      S=D;apply(S);storeLocal(JSON.stringify(S));st("Scaricato dal cloud ✓ (dati del "+fd(ct)+")");return;
    }
    /* questo dispositivo è più recente: carico */
    return fetch(SYNC_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)})
      .then(function(r){if(!r.ok)throw 0;st("Caricato sul cloud ✓");});
  }).catch(function(){st("Sincronizzazione non riuscita: controlla la connessione");})
    .then(function(){b.disabled=false;});
}

/* ---- Avvio ---- */
apply(S);
IDS.forEach(function(i){$(i).addEventListener("input",function(){save();calc();});});
$("note").addEventListener("input",grow);
window.addEventListener("resize",grow);window.addEventListener("load",grow);
idb(function(db){
  if(!db)return;
  try{var q=db.transaction("k").objectStore("k").get(KEY);
    q.onsuccess=function(){var D=null;try{D=JSON.parse(q.result);}catch(e){}
      if(D&&(D._t||0)>(S._t||0)){S=D;apply(S);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}};
  }catch(e){}
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
$("sync").onclick=sync;
$("ver").textContent="v"+APP_VERSION;
checkUpdate();
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate();});
window.addEventListener("pageshow",function(e){if(e.persisted)checkUpdate();});

/* ---- Azzera: cancella solo su questo dispositivo (il cloud cambia solo con "Sincronizza") ---- */
$("reset").onclick=function(){
  if(confirm("Azzerare tutti i campi e le note su questo dispositivo?\n(Il cloud non viene toccato finché non premi Sincronizza.)")){
    S={_t:Date.now()};apply(S);
    storeLocal(JSON.stringify(S));
    calc();
  }
};

/* ---- Export .txt ---- */
function t(x){return String(Math.round(x*100)/100).replace(".",",");}
/* Allineamento per il carattere DejaVu Sans (largo variabile): misuro la larghezza reale di ogni riga.
   TARGET = dove finiscono i numeri a destra, X0 = dove inizia la colonna delle ore. Aumenta/diminuisci per spostare. */
var LINEW=55,TARGET=36900,X0=12933,SPW=651;
var CW=[651,821,942,1716,1303,1946,1597,563,799,799,1024,1716,651,739,651,690,1303,1303,1303,1303,1303,1303,1303,1303,1303,1303,690,690,1716,1716,1716,1087,2048,1401,1405,1430,1577,1294,1178,1587,1540,604,604,1343,1141,1767,1532,1612,1235,1612,1423,1300,1251,1499,1401,2025,1403,1251,1403,799,690,799,1716,1024,1024,1255,1300,1126,1300,1260,721,1300,1298,569,569,1186,569,1995,1298,1253,1300,1300,842,1067,803,1298,1212,1675,1212,1212,1075,1303,690,1303,1716];
function sw(s){var x=0,i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);x+=(c>=32&&c<=126)?CW[c-32]:1300;}return x;}
function spc(k){return new Array(Math.max(k,0)+1).join(" ");}
function row(l,r){var g=Math.round((TARGET-sw(l)-sw(r))/SPW);if(g<2)g=2;return l+spc(g)+r;}
function padw(a,x){var g=Math.round((x-sw(a))/SPW);if(g<1)g=1;return a+spc(g);}
function buildTxt(){
  var D=new Array(LINEW+1).join("-");
  var sett=n($("sett").value),sab=n($("sab").value);
  var expr=t(sett)+"x"+$("selS").value+(sab>0?"+"+t(sab)+"x"+$("selB").value:"");
  var ore=sett*n($("selS").value)+sab*n($("selB").value);
  var matt=n($("matt").value),pom=n($("pom").value);
  var i15=n($("iban").value)*15,b9=n($("boll").value)*9,p4=n($("prot").value)*4;
  var tot=ore*4+i15+b9+p4;
  var L=[
    "MONTE ORE",
    row(padw(expr,X0)+t(ore)+"ORE",t(ore*4)),D,
    "CONTRATTI",
    row(t(n($("ko").value))+" KO","0"),
    t(matt+pom)+" ENERGIA",t(matt)+" MATT",t(pom)+" POM",D,
    row(t(n($("iban").value))+" iban",t(i15)),"",
    row(t(n($("boll").value))+" boll",t(b9)),D,
    row(t(n($("prot").value))+"  PROTETTA",t(p4)),D,
    row("",t(tot))
  ];
  var nt=$("note").value.replace(/\r\n?/g,"\n").replace(/^(?:[ \t]*\n)+/,"").replace(/\s+$/,"");
  if(nt)L.push("","","NOTE:","",nt);
  return L.join("\n")+"\n";
}
/* ---- Import .txt (stesso formato del file salvato) ---- */
function parseTxt(txt){
  var lines=txt.replace(/^\uFEFF/,"").split(/\r?\n/),D={sett:"",sab:"",selS:"4",selB:"4",ko:"",matt:"",pom:"",iban:"",boll:"",prot:"",note:""},i,m,L,seen=false,found=false,N="[\\d.,]+";
  for(i=0;i<lines.length;i++){
    L=lines[i];
    if(/^\s*Note:\s*$/i.test(L)){D.note=lines.slice(i+1).join("\n").replace(/^(?:[ \t]*\n)+/,"").replace(/\s+$/,"");break;}
    if(/^\s*MONTE ORE\s*$/.test(L)){seen=true;continue;}
    if((m=L.match(new RegExp("^\\s*("+N+")x(\\d+)(?:\\+("+N+")x(\\d+))?\\s*"+N+"\\s*ORE")))){D.sett=m[1];D.selS=m[2];D.sab=m[3]||"";D.selB=m[4]||"4";found=true;continue;}
    if((m=L.match(new RegExp("^\\s*("+N+")\\s+KO\\b","i"))))D.ko=m[1];
    else if((m=L.match(new RegExp("^\\s*("+N+")\\s+MATT\\b","i"))))D.matt=m[1];
    else if((m=L.match(new RegExp("^\\s*("+N+")\\s+POM\\b","i"))))D.pom=m[1];
    else if((m=L.match(new RegExp("^\\s*("+N+")\\s+iban\\b","i"))))D.iban=m[1];
    else if((m=L.match(new RegExp("^\\s*("+N+")\\s+boll\\b","i"))))D.boll=m[1];
    else if((m=L.match(new RegExp("^\\s*("+N+")\\s+PROTETTA\\b","i"))))D.prot=m[1];
    else if((m=L.match(new RegExp("^\\s*("+N+")\\s*$"))))D._tot=m[1];
  }
  if(!seen||!found)return null;
  if(["4","5","6","7","8"].indexOf(D.selS)<0)D.selS="4";
  if(["4","5","6","7","8"].indexOf(D.selB)<0)D.selB="4";
  return D;
}
$("imp").onclick=function(){$("impf").value="";$("impf").click();};
$("impf").onchange=function(){
  var fl=this.files&&this.files[0];if(!fl)return;
  var rd=new FileReader();
  rd.onload=function(){
    var D=parseTxt(String(rd.result));
    if(!D){st("File non riconosciuto: non sembra un .txt di Conteggio");return;}
    if(!confirm("Sostituire i dati attuali con quelli del file \""+fl.name+"\"?"))return;
    apply(D);save();
    $("fname").value=fl.name.replace(/\.txt$/i,"");
    if(D._tot!==undefined&&Math.abs(n(D._tot)-TOT)>0.005)alert("Importato, ma il totale del file ("+D._tot+") è diverso da quello calcolato ("+t(TOT)+"). Controlla i numeri.");
    else st("Importato ✓");
  };
  rd.onerror=function(){st("Impossibile leggere il file");};
  rd.readAsText(fl,"utf-8");
};
$("fname").value=new Date().toLocaleString("it-IT",{month:"long"}).toUpperCase();
$("save").onclick=function(){
  var name=$("fname").value.trim().replace(/\.txt$/i,"").replace(/[\\\/:*?"<>|]/g,"")||"conteggio";
  var blob=new Blob([buildTxt()],{type:"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name+".txt";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  st("Scaricato "+name+".txt");
};
calc();
</script>
</body>
</html>
